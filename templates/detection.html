<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Cancer Detection</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3e4a5a);
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            background: #2c2f3a;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 25px;
        }

        input[type="file"] {
            display: none;
        }

        .dropzone {
            border: 2px dashed #4a90e2;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            color: #cfd8dc;
            transition: background 0.3s ease;
        }

        .dropzone:hover {
            background-color: #374151;
        }

        .button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .button:hover {
            background-color: #1c70c7;
        }

        #preview-container {
            margin-top: 25px;
            display: none;
        }

        #preview {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            border: 2px solid #4a90e2;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        /* 🔄 Refresh Button Styles */
        .refresh-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            margin-top: 15px;
            float: right;
            color: #f0f0f0;
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: rotate(90deg);
            color: #4a90e2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Skin Cancer Image Classifier</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="upload" name="image" accept="image/*" required onchange="previewImage(event)">
            <label for="upload" class="dropzone">Click or Drag Image Here</label>
            <div id="preview-container">
                <p style="color: #aaa; font-size: 14px;">Selected Image Preview:</p>
                <img id="preview" alt="Image Preview">
            </div>
            <button type="submit" class="button">Detect</button>
        </form>

        <div id="result"></div>
        <button onclick="location.reload()" class="refresh-btn" title="Refresh Page">🔄</button>
    </div>

<script>
    function previewImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('preview-container');

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');
    const detectButton = form.querySelector('.button');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(form);
        detectButton.innerText = 'Detecting...';
        detectButton.disabled = true;

        fetch('/predict-skin', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            resultDiv.innerText = data.result || 'No result returned.';
            detectButton.innerText = 'Detect';
            detectButton.disabled = false;
        })
        .catch(error => {
            resultDiv.innerText = 'Error: ' + error.message;
            detectButton.innerText = 'Detect';
            detectButton.disabled = false;
        });
    });
</script>
</body>
</html>
